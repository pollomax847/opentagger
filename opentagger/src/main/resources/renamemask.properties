# ============================================================
# Masques de renommage OpenTagger
# Format: filenameMasksN=Label\:expression_javascript
#
# Variables disponibles: title, artist, albumartist, album,
#   trackno, discno, disctotal, albumyear, genre,
#   iscompilation (bool), isclassical (bool), ishd (bool)
#
# Fonctions JS: ifnotempty(val,sep), ifnotempty2(v1,v2,sep),
#   ifmultidisc(val), pad(num,len), addCompilations()
# ============================================================

# ── Masque 0 : iTunes Smart ───────────────────────────────
# Compilations  → Compilations/Album/Track - Artist - Title
# Albums normaux → AlbumArtist/Album/Track - Title
# Multi-disc    → Disc XX/ inséré automatiquement
filenameMasks0=[iTunes Smart] Compilations ou AlbumArtist/Album/Track\:(iscompilation == '1')\n? 'Compilations/' + album + '/' + ifmultidisc('Disc ' + pad(discno,2) + '/') + ifnotempty(pad(trackno,2),' - ') + artist + ' - ' + title\n: ifnotempty2(albumartist,artist,'/') + ifnotempty(album,'/') + ifmultidisc('Disc ' + pad(discno,2) + '/') + ifnotempty(pad(trackno,2),' - ') + title

# ── Masque 1 : Standard ───────────────────────────────────
# AlbumArtist/Album/Track - Title (multi-disc aware)
filenameMasks1=Standard AlbumArtist/Album/Track - Title\:ifnotempty2(albumartist,artist,'/')\n+ ifnotempty(album,'/')\n+ ifmultidisc('Disc ' + pad(discno,2) + '/')\n+ ifnotempty(pad(trackno,2),' - ')\n+ title

# ── Masque 2 : Lidarr / Plex ─────────────────────────────
# Format natif Lidarr + Plex Media Server
# AlbumArtist/Album (Année)/Track - Title
# Compilations → Various Artists/Album (Année)/Track - Artist - Title
filenameMasks2=[Lidarr/Plex] AlbumArtist/Album (Year)/Track - Title\:(iscompilation == '1')\n? ifnotempty2(albumartist,artist,'/') + ifnotempty(album + (albumyear.length > 0 ? ' (' + albumyear.substring(0,4) + ')' : ''),'/') + ifmultidisc('Disc ' + pad(discno,2) + '/') + ifnotempty(pad(trackno,2),' - ') + artist + ' - ' + title\n: ifnotempty2(albumartist,artist,'/') + ifnotempty(album + (albumyear.length > 0 ? ' (' + albumyear.substring(0,4) + ')' : ''),'/') + ifmultidisc('Disc ' + pad(discno,2) + '/') + ifnotempty(pad(trackno,2),' - ') + title

# ── Masque 3 : Fichier seul ───────────────────────────────
# Renomme uniquement le fichier, sans changer de dossier
# Résultat: 01 - Artist - Title.mp3
filenameMasks3=Fichier seul Track - Artist - Title\:ifnotempty(pad(trackno,2),' - ') + artist + ' - ' + title

# ── Fonctions JavaScript utilitaires ─────────────────────
javascriptFunctions0=addClassical()\:function addClassical()\n{\n return isclassical \=\='1' ? 'Classical/' \: 'PopRock/';\n}
javascriptFunctions1=addClassicalOnly()\:function addClassicalOnly()\n{\n return isclassical \=\='1' ? 'Classical/' \: '';\n}
javascriptFunctions2=addCompilation()\:function addCompilation()\n{\n  return iscompilation \=\='1' ? 'Compilation/' \: '';\n}
javascriptFunctions3=addCompilations()\:function addCompilations()\n{\n  return iscompilation \=\='1' ? 'Compilations/' \: '';\n}
javascriptFunctions4=addHD()\:function addHD()\n{\n  return ishd \=\='1' ? 'HD/' \: '';\n}
javascriptFunctions5=ifmultidisc(value)\:function ifmultidisc(value) {\n   if(disctotal>1)\n   {\n      return value;\n   }\n   else\n   {\n      return "";\n   }\n}
javascriptFunctions6=ifnotempty(value,sep)\:function ifnotempty(value,sep){\n     return value.length > 0 ? value + sep \: '';\n }
javascriptFunctions7=ifnotempty2(value1,value2,sep)\: function ifnotempty2(value1,value2,sep){\n     return value1.length > 0 ? value1 + sep \:value2.length > 0 ? value2 + sep\:'' ;\n }
javascriptFunctions8=ifnotempty3(value1,value2,value3, sep)\: function ifnotempty3(value1,value2,value3, sep){\n     return value1.length > 0 ? value1 + sep \n\t\:value2.length > 0 ? value2 + sep\n\t\:value3.length > 0 ? value3 + sep\n\t\:'';\n }
javascriptFunctions9=pad(number, length)\:function pad(number, length) {\n   if (number \=\= '') { return '';}\n   var str \= '' + number; \n   while (str.length < length) {  \n      str \= '0' + str;\n   }\n   return str;\n}
javascriptFunctions10=substring(value,length)\:function substring(value,length){\n     return value.length > length ? value.substring(0,length)  \: value;\n }
javascriptFunctions11=toLowerCase(str)\:function toLowerCase(str) {\n  return str.toLowerCase()\n}
javascriptFunctions12=toUpperCase(str)\:function toUpperCase(str) {\n  return str.toUpperCase()\n}
javascriptFunctions13=unpad(value)\:function unpad(value)\n{\n      return value.replace(/^0+/, '');\n}
