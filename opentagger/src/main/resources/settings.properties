# ============================================================
# OpenTagger - Configuration
# Copier ce fichier dans ~/.opentagger/settings.properties
# pour surcharger les valeurs par defaut.
# ============================================================

# --- Cles API ---
# Vides par defaut : ce sont des cles personnelles (quota/CGU par developpeur/application),
# contrairement au Client ID/Secret OAuth MusicBrainz (onglet Preferences > MusicBrainz), concu
# lui pour etre partage entre tous les utilisateurs d'une meme appli (cf doc OAuth2 MusicBrainz).
# A remplir dans Preferences > APIs avec vos propres cles gratuites :
#   AcoustID  : https://acoustid.org/api-key
#   Discogs   : https://www.discogs.com/settings/developers
#   FanArt.tv : https://fanart.tv/get-an-api-key/
#   Last.fm   : https://www.last.fm/api/account/create
acoustid.api_key        =
discogs.consumer_key    =
discogs.consumer_secret =
fanart.api_key          =
lastfm.api_key          =

# --- Contact (requis par les APIs) ---
app.contact = bain.paul24@gmail.com
app.version = 0.9.3

# --- AcoustID (identification par empreinte audio) ---
acoustid.use_acoustid = true

# --- MusicBrainz ---
musicbrainz.server          = https://musicbrainz.org/ws/2
musicbrainz.results_limit   = 5
musicbrainz.only_official   = true
# original = annee la plus ancienne, release = annee de cette edition
musicbrainz.preferred_year  = original

# --- MusicBrainz OAuth2 (contribution : soumission de tags/notes) ---
# Identifie l'APPLICATION OpenTagger aupres de MusicBrainz, pas un utilisateur individuel.
# Volontairement embarque : MusicBrainz classe les apps desktop comme "applications publiques"
# (doc officielle OAuth2) dont le Client Secret "n'est pas traite comme un secret et peut etre
# embarque dans le code" — chaque utilisateur autorise ensuite SON PROPRE compte personnel via
# le bouton de connexion (Preferences > MusicBrainz), meme modele que Picard.
mb.oauth.client_id     = zubT5UGkWJ3mQCN70jLiWxhvaqV0FhXz
mb.oauth.client_secret = IJKX3qsI2p1KNOjudehkhKg7KlYZ1Tly

# --- Correspondance ---
# Score minimum (0-100) pour appliquer automatiquement en mode dossier
match.min_score_auto = 90
# Activer AcoustID par defaut en mode dossier
match.use_acoustid   = false

# --- Discogs ---
# Options : genre | style | style_then_genre | genre_then_style
discogs.genre_source = style_then_genre
discogs.max_genres   = 3

# --- Last.fm ---
lastfm.use_tags  = true
discogs.max_tags = 3

# --- FanArt.tv ---
fanart.download_cover = true

# Types primaires MB autorises (vide = tous) : Album,Single,EP,Broadcast,Other
releases.allowed_primary_types    =
# Types secondaires MB a exclure (vide = aucun) : Compilation,Live,Soundtrack,Greatest Hits,Remix,Demo,DJ-mix,Mixtape/Street
releases.excluded_secondary_types =

# --- Renommage ---
# Index du masque par defaut (voir renamemask.properties)
rename.default_mask = 3

# --- Transcodage audio ---
# Transcoder automatiquement avant le taguage (true/false)
transcode.auto_before_tag = false
# Format cible : mp3 | flac | aac | ogg | opus
transcode.format          = mp3
# Debit en kbps (ignoré pour FLAC) : 128 | 192 | 256 | 320
transcode.bitrate_kbps    = 320
# Supprimer le fichier source apres transcodage (false = garder les deux)
transcode.delete_source   = false
